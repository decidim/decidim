require:
  - decidim/dev/rubocop/cop/decidim/enforce_permission_to_empty_line
  - decidim/dev/rubocop/cop/decidim/message_antipattern
  - decidim/dev/rubocop/cop/decidim/organization_scoped_finder
  - decidim/dev/rubocop/cop/decidim/rspec/memoized_name

Decidim/MessageAntipattern:
  Enabled: true
  Include:
    - "**/spec/**/*"
    - "**/test/**/*"

Decidim/EnforcePermissionToEmptyLine:
  Enabled: true
  Severity: warning
  Include:
    - "**/app/controllers/**/*.rb"

Decidim/OrganizationScopedFinder:
  Enabled: true
  Severity: warning
  Include:
    - "**/app/controllers/**/admin/**/*.rb"
  Exclude:
    - "**/decidim-system/**/*.rb"

Decidim/RSpec/MemoizedName:
  Enabled: true
  Include:
    - "**/spec/system/**/*"
    - "**/spec/shared/**/*"
