<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<!-- A logo exported by a vector editor, using a style sheet, symbol reuse and an embedded raster image. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 16 16">
  <style>.logo { fill: #000; } .dot { fill: url(#dot); }</style>
  <defs>
    <circle id="dot" cx="8" cy="8" r="8"/>
  </defs>
  <use xlink:href="#dot" class="logo" style="fill:url(#dot);"/>
  <image href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" width="1" height="1"/>
  <a xlink:href="https://example.org"><text y="15">offset=0; one=1</text></a>
</svg>
