<?xml version="1.0" encoding="UTF-8"?>
<!-- An animation whose target reference decodes to the multi-byte identifier of
     a link, which does not load any resource. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 16 16">
  <a id="café" xlink:href="https://example.org"><text y="15">Example</text></a>
  <set xlink:href="#caf%C3%A9" attributeName="href" to="https://example.org" dur="1s" fill="freeze"/>
</svg>
