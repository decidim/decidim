<?xml version="1.0" encoding="UTF-8"?>
<!-- An animation whose target and whose list of values use a percent-encoded fragment,
     which is resolved to the element of the document with the decoded identifier. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 16 16">
  <defs><pattern id="paint"><rect width="16" height="16"/></pattern></defs>
  <image width="16" height="16"><animate xlink:href="#%70%61%69%6E%74" attributeName="href" values="#%70%61%69%6E%74;#%70%61%69%6E%74" dur="1s"/></image>
</svg>
