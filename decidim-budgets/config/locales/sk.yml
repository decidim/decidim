      pabulib_rules:
        equalshares:
          help: Metóda rovnakých podielov (MES) bez doplnenia. V metóde MES začína každý hlasujúci s rovnakým virtuálnym podielom z rozpočtu a projekt je vybraný vtedy, keď si ho jeho podporovatelia môžu spoločne dovoliť.
          label: Metóda rovnakých podielov (%{rule})
        equalshares/add1:
          help: Použije základné pravidlo equalshares, ale ak sa zastaví príliš skoro, postupne zvyšuje virtuálny rozpočet každého hlasujúceho vždy o 1 jednotku (Add1) a prepočítava výsledok, pokiaľ sa výsledné vybrané projekty stále zmestia do skutočného rozpočtu.
          label: Metóda rovnakých podielov, add1 (%{rule})
        equalshares/add1_comparison:
          help: Použije pravidlo equalshares/add1 a následne aplikuje rovnaký krok porovnania ako vyššie.
          label: Metóda rovnakých podielov, add1 s porovnaním (%{rule})
        equalshares_comparison:
          help: 'Použije základné pravidlo equalshares a následne pridá jeden krok navyše: porovná jeho výsledok s referenčným výsledkom pažravej metódy a zmení ho iba vtedy, ak viac hlasujúcich uprednostňuje výsledok pažravej metódy.'
          label: Metóda rovnakých podielov, s porovnaním (%{rule})
        greedy:
          help: Štandardný aproximačný prístup typu problém batohu. Projekty sú zoradené podľa počtu hlasov (zostupne). Algoritmus prechádza zoznamom a vyberá projekty, ktoré sa zmestia do zostávajúceho rozpočtu. Ak je projekt príliš drahý vzhľadom na aktuálne zostávajúce prostriedky, preskočí sa a algoritmus pokračuje na ďalší projekt, aby zistil, či sa zmestí.
          label: Pažravá metóda (%{rule})
        greedy_custom:
          help: Používa sa pre špeciálne prípady, ktoré nezapadajú do štandardných algoritmov, ako sú manuálne presuny rozpočtu alebo zložité hybridné pravidlá.
          label: Pažravá metóda, vlastná (%{rule})
        greedy_exclusive:
          help: Rieši konfliktné skupiny projektov. Funguje ako štandardná pažravá metóda, ale ak sú viaceré „víťazné“ projekty v konflikte (napr. sú v rovnakej výlučnej zóne alebo kategórii), uplatní sa pravidlo hierarchie (napr. projekty na úrovni mestskej časti môžu mať prednosť pred celomestskými alebo naopak) namiesto spoliehania sa výlučne na počet hlasov.
          label: Pažravá metóda, výlučná (%{rule})
        greedy_no_skip:
          help: Projekty sú zoradené podľa počtu hlasov (zostupne). Algoritmus vyberá projekty, ktoré sa zmestia do zostávajúceho rozpočtu, ale okamžite sa zastaví pri prvom projekte, ktorý sa už nezmestí. Žiadne nasledujúce projekty sa už nezvažujú, aj keby sa do rozpočtu zmestili.
          label: Pažravá metóda, bez preskakovania (%{rule})
        greedy_threshold:
          help: Správa sa ako štandardná pažravá metóda, ale projekty sa zvažujú len vtedy, ak spĺňajú definovanú hranicu min_project_score_threshold.
          label: Pažravá metóda, s hranicou (%{rule})
        unknown:
          help: Informácia buď nie je k dispozícii, alebo existovalo viacero možností a nie je jasné, ktorá z nich platí.
          label: Neznáme (%{rule})
