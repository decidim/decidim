        weight: 順番の位置
      pabulib_rules:
        equalshares:
          help: 補完なしの均等シェア法（MES）。MESでは、各投票者に同額の仮想予算を割り当て、あるプロジェクトの支持者全員の残り予算を合わせて事業費を賄える場合に、そのプロジェクトを採択します。
          label: 均等持分法 (%{rule})
        equalshares/add1:
          help: まず基本均等シェア法を適用します。予算を十分に使わないまま処理が終了した場合には、選定されたプロジェクトの総費用が実予算を超えない範囲で、各投票者に割り当てる仮想予算を1単位ずつ増額し、その都度、選定結果を再計算します。この補完方法をAdd1と呼びます。
          label: 均等シェア法, Add1 (%{rule})
        equalshares/add1_comparison:
          help: 均等シェア法/Add1を使用したうえで、上記と同じ比較処理を適用します。
          label: 均等シェア法・Add1比較（%{rule}）
        equalshares_comparison:
          help: '基本均等シェア法を使用し、その後に追加の処理を行います。具体的には、その結果を貪欲法による基準結果と比較し、より多くの投票者が貪欲法の結果を支持する場合に限って、そちらへ切り替えます。'
          label: 均等シェア法・比較（%{rule}）
        greedy:
          help: 標準的なナップサック問題型の近似手法です。プロジェクトを得票数の多い順に並べ、一覧を順に確認しながら、残りの予算に収まるプロジェクトを採択します。あるプロジェクトの費用が現在の残予算を上回る場合はそのプロジェクトを飛ばし、次のプロジェクトが予算内に収まるかを確認します。
          label: 貪欲法 (%{rule})
        greedy_custom:
          help: 手動による予算の再配分や複雑なハイブリッドルールなど、標準的なアルゴリズムでは扱えない特殊なケースに使用します。
          label: 貪欲法、カスタム (%{rule})
        greedy_exclusive:
          help: 競合するプロジェクトのグループを処理します。基本的には標準的な貪欲法として動作しますが、複数の採択候補が競合する場合（たとえば、同じ排他的な区域やカテゴリに属する場合）は、得票数だけで決定せず、優先順位に関するルールを適用します。たとえば、地区単位のプロジェクトを市全体のプロジェクトより優先する、またはその逆といったルールです。
          label: 貪欲法、排他的 (%{rule})
        greedy_no_skip:
          help: プロジェクトを得票数の多い順に並べます。アルゴリズムは、残りの予算に収まるプロジェクトを順に採択しますが、予算に収まらないプロジェクトが最初に現れた時点で直ちに処理を終了します。それ以降のプロジェクトは、予算内に収まる場合でも考慮しません。
          label: 貪欲法、スキップなし (%{rule})
        greedy_threshold:
          help: 標準的な貪欲法と同様に動作しますが、定義されたプロジェクトの最低得点しきい値（min_project_score_threshold）を満たすプロジェクトのみを採択候補とします。
          label: 貪欲法、しきい値あり (%{rule})
        unknown:
          help: 情報が得られないか、複数の可能性があり、どれに該当するのかが不明です。
          label: 不明 (%{rule})
      pabulib_vote_types:
        approval: 承認 (%{type})
        cumulative: 累積値 (%{type})
        ordinal: 順位式（%{type}）
        scoring: スコアリング（%{type}）
