      pabulib_rules:
        equalshares:
          help: Akzio Berdinen Metodo (MEES) amaierarik gabe. EAetan, boto-emaile bakoitza aurrekontuaren zati birtual berdinarekin hasten da, eta proiektu bat hautatzen da bere aldekoek elkarrekin ordaindu dezaketenean.
          label: Akzio Berdinen Metodoa (%{rule})
        equalshares/add1:
          help: Erabili oinarrizko berdinketak, baina goizegi gelditzen bada, jarraitu hautesle bakoitzaren aurrekontu birtuala unitate batean handitzen (Add 1) eta birkonputatu, beti ere aukeratutako azken proiektuak aurrekontu errealean sartzen badira.
          label: Partaidetza berdinen metodoa, add1 (%{rule})
        equalshares/add1_comparison:
          help: Erabili equalshares/add1, eta, ondoren, aplikatu aurreko konparazio-urrats bera.
          label: Partaidetza berdinen metodoa, add1 konparaketa (%{rule})
        equalshares_comparison:
          help: 'Oinarrizko berdinketak erabili, eta gero beste urrats bat gehitu: bere emaitza erreferentziako diruzale batekin alderatu, eta babesle gehiagok emaitza diruzalea nahiago badute bakarrik aldatu.'
          label: Akzio berdinen metodoa, (%{rule}) konparazioa 
        greedy:
          help: Knapsack estiloko hurbilketa estandarra. Proiektuak babes kopuruaren arabera ordenatzen dira (handienetik txikienera). Algoritmoak zerrenda zeharkatzen du, geratzen den aurrekontuan sartzen diren proiektuak hautatuz. Proiektu bat une horretan geratzen diren funtsentzat garestiegia bada, saltatu egiten da, eta algoritmoak hurrengo proiektuarekin jarraitzen du, ea aurrekontuan sartzen den ikusteko.
          label: Algoritmo jatuna  (%{rule})
        greedy_custom:
          help: Algoritmo estandarrak betetzen ez dituen kasu berezietan erabiltzen da, hala nola eskuzko erregogor-lokazioak edo erregal-arau osagarriak.
          label: Algoritmo jatuna, pertonalizatua  (%{rule})
        greedy_exclusive:
          help: Proiektu-talde gatazkatsuak kudeatzen ditu. Greedy metodo estandarraren antzera funtzionatzen du, baina hainbat proiektu 'irabazle' elkarren artean gatazkan badaude (adibidez, eremu edo kategoria esklusibo berean badaude), hierarkia-arau bat aplikatzen da (adibidez, barruti-mailako proiektuek hiri osoko proiektuen aurrean lehentasuna izan dezakete, edo alderantziz), babes kopuruan soilik oinarritu beharrean.
          label: Algoritmo jatuna, pertonalizatua (%{rule})
        greedy_no_skip:
          help: Proiektuak boto zenbaketaren arabera ordenatzen dira (beheranzkoa). Algoritmoak geratzen den aurrekontuan sartzen diren proiektuak aukeratzen ditu baina berehala gelditzen da sartzen ez den lehenengo proiektuan. Ez da ondorengo proiekturik kontuan hartzen, egokituko balira ere.
          label: Algoritmo jatuna, esklusiboa (%{rule})
        greedy_threshold:
          help: Diruzalekeria estandar gisa jokatzen du, baina proiektuak soilik kontuan hartzen dira definitutako min_project_score_threshold betetzen badute.
          label: Algoritmo jatuna, atalase (%{rule})
        unknown:
          help: Edo informazioa ez dago eskuragarri, edo aukera anitz zeuden, eta ez dago argi zein aplikatzen den.
          label: Ezezaguna (%{rule})
      pabulib_vote_types:
