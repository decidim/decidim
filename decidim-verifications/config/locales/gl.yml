        another_dummy_authorization_handler:
          help:
            - Un exemplo de xestor de autorización para que as persoas desenvolvedoras entendan como funciona unha verificación sinxela.
            - Está dirixido a persoas desenvolvedoras para que entendan como implementar o seu propio sistema de verificación.
            - Verifícate introducindo un número de pasaporte que comece por «A».
        csv_census:
          help:
            - O equipo de administración carga un CSV cos correos electrónicos das persoas participantes aceptadas.
            - Só se poden verificar as persoas participantes cun correo electrónico incluído nese ficheiro CSV.
        default:
          help:
            - A axuda do xestor de autorización non está definida.
            - Unha persoa desenvolvedora debe definir a axuda na clave de tradución (i18n) «%{authorization_handler}»
        dummy_authorization_handler:
          help:
            - Un exemplo de xestor de autorización para que as persoas desenvolvedoras entendan como funciona unha verificación sinxela.
            - Está dirixido a persoas desenvolvedoras para que entendan como implementar o seu propio sistema de verificación.
            - Verifícate introducindo un número de documento que remate en «X».
        ephemeral_dummy_authorization_handler:
          help:
            - Un exemplo de xestor de autorización efémero para que as persoas desenvolvedoras entendan como funciona unha verificación sinxela.
            - Está dirixido a persoas desenvolvedoras para que entendan como implementar o seu propio sistema de verificación.
            - É unha copia da autorización de exemplo.
            - Verifícate introducindo un número de documento que remate en «X».
        id_documents:
          help:
            - Os participantes encherán a súa información de identidade e cargarán unha copia do seu documento.
            - Enche a información presente na imaxe cargada.
            - A información debe coincidir co que o participante enche.
            - Se non podes ver claramente a información ou non podes verificala, podes rexeitar a solicitude e a persoa participante poderá corrixila.
        postal_letter:
          help:
            - Os participantes solicitan que se envíe un código de verificación ao seu enderezo.
            - Envía a carta ao seu enderezo co código de verificación.
            - Marca a letra como enviada.
            - Despois de marcar a carta como enviada, o participante poderá inserir o código e ser verificado.
        sms:
          help:
            - As persoas participantes solicitan que se lles envíe un código de verificación ao teléfono.
            - Deben introducir o código para verificarse.
            - Se non reciben o código, poden solicitalo de novo.
