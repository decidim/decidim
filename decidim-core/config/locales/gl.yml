      index:
        description: Benvida á páxina de datos abertos de %{organization_name}. Aquí atoparás ficheiros de datos xerados regularmente a partir de distintos procesos deliberativos e de gobernanza de %{organization_name}. Estes ficheiros póñense á disposición para promover a transparencia, a accesibilidade e a colaboración. A continuación atoparás información detallada sobre que son estes ficheiros, como abrilos e traballar con eles e unha descrición do contido e da estrutura de cada ficheiro.
        detailed:
          body_1: 'A continuación descríbese cada conxunto de datos, incluída a súa estrutura e o tipo de información que contén:'
          components: Compoñentes
          spaces: Espazos participativos
          title: Explicación detallada de cada ficheiro
        download:
          components: Compoñentes
          core: Núcleo
          spaces: Espazos participativos
          title: Descargar recursos
        download_open_data: Descargar todos os ficheiros de datos abertos
        download_resource: Descargar %{resource_name} en formato CSV
        explanation:
          body_1: Estes ficheiros son conxuntos de datos exportados dos procesos participativos de %{organization_name}, como propostas, comentarios e reunións. Conteñen datos estruturados en bruto que poden usarse para análise, investigación ou integración con outras ferramentas. Os datos actualízanse automaticamente cada 24 horas para garantir o acceso á información máis recente.
          body_2: Estes ficheiros están en formato CSV (valores separados por comas), un formato moi estendido que pode abrirse e procesarse con diversas aplicacións, incluídas follas de cálculo, editores de texto e ferramentas de análise de datos.
          title: Que son estes ficheiros?
        how_to:
          step_1:
            body_html: Preme as ligazóns seguintes para descargar os ficheiros CSV no teu equipo.
            title: 1. Descargar os ficheiros
          step_2:
            body_html: |-
              <ul>
              <li><b>Aplicacións de follas de cálculo</b>: podes abrir ficheiros CSV con aplicacións como Microsoft Excel, Google Sheets ou LibreOffice Calc. Abre a aplicación, selecciona «Abrir» no menú Ficheiro e escolle o ficheiro CSV descargado.</li>
              <li><b>Editores de texto</b>: os ficheiros CSV tamén se poden abrir con calquera editor de texto, como Notepad ou Sublime Text. Mostrarase o dato en bruto, cunha liña por fila e os valores separados por comas.</li>
              <li><b>Ferramentas de análise de datos</b>: se coñeces ferramentas como Python (con pandas), R ou bases de datos SQL, podes importar directamente estes ficheiros CSV para procesalos e analizalos.</li>
              </ul>
            title: 2. Abrir os ficheiros
          step_3:
            body_html: |-
              <ul>
              <li><b>Filtrar e ordenar</b>: nas aplicacións de follas de cálculo podes filtrar e ordenar os datos para centrarte en subconxuntos concretos de información.</li>
              <li><b>Análise</b>: usa os datos para realizar distintas análises, como contar propostas, analizar tendencias nos comentarios ou avaliar a participación nas reunións.</li>
              <li><b>Visualización</b>: podes crear gráficos e outras visualizacións para facilitar a interpretación dos datos.</li>
              </ul>
            title: 3. Traballar cos datos
          title: Como abrir e traballar con estes ficheiros
        license:
