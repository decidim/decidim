name: "[CI] Api"
on:
  push:
    branches:
      - develop
      - release/*
      - "*-stable"
  pull_request:
    branches-ignore:
      - "chore/l10n*"
    paths:
      - "*"
      - ".github/**"
      - "decidim-api/**"
      - "decidim-comments/**"
      - "decidim-core/**"
      - "decidim-dev/**"
      - "decidim-participatory_processes/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: Tests
    uses: ./.github/workflows/test_app.yml
    secrets: inherit
    with:
      working-directory: "decidim-api"
      test_command: bundle exec parallel_test --type rspec --pattern spec/
      bullet_enabled: false

  types:
    name: "Types: ${{ matrix.module }}"
    strategy:
      fail-fast: false
      matrix:
        module:
          - decidim-accountability
          - decidim-assemblies
          - decidim-blogs
          - decidim-budgets
          - decidim-collaborative_texts
          - decidim-comments
          - decidim-conferences
          - decidim-core
          - decidim-debates
          - decidim-dev
          - decidim-forms
          - decidim-initiatives
          - decidim-meetings
          - decidim-pages
          - decidim-participatory_processes
          - decidim-proposals
          - decidim-surveys
    uses: ./.github/workflows/test_app.yml
    secrets: inherit
    with:
      working-directory: ${{ matrix.module }}
      test_command: bundle exec parallel_test --type rspec --pattern spec/types/
      bullet_enabled: false
