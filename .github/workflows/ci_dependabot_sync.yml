name: Sync Gemfile.lock files

permissions:
  contents: write

on:
  pull_request:
    branches:
      - dependabot/**
    paths:
      - 'Gemfile.lock'
      - 'decidim-generators/Gemfile.lock'

jobs:
  sync-lockfiles:
    runs-on:  ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.ACTION_BACKPORTER_PAT}}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version:  '3.4.7'
          bundler-cache: false

      - name: Update decidim-generators Gemfile.lock if root changed
        if: contains(github.event.pull_request.files, 'Gemfile.lock')
        run: |
          cd decidim-generators
          bundle install

      - name:  Commit changes
        run: |
          git config user.name "decidim-bot"
          git config user.email "101816158+greenwoodt@users.noreply.github.com"
          git add Gemfile.lock decidim-generators/Gemfile.lock
          git diff --staged --quiet || git commit -m "chore: sync Gemfile.lock files"
          git push
