name: Sync Gemfile.lock files

on:
  pull_request:
    paths:
      - 'Gemfile.lock'
      - 'decidim-generators/Gemfile.lock'

jobs:
  sync-lockfiles:
    runs-on:  ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version:  '3.4.7
          bundler-cache: false

      - name: Update decidim-generators Gemfile.lock if root changed
        if: contains(github. event.pull_request.files, 'Gemfile.lock')
        run: |
          cd decidim-generators
          bundle install

      - name:  Commit changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github. com'
          git add Gemfile.lock decidim-generators/Gemfile.lock
          git diff --staged --quiet || git commit -m "chore: sync Gemfile.lock files"
          git push
