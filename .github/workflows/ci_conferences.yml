name: "[CI] Conferences"
on:
  push:
    branches:
      - develop
      - release/*
      - "*-stable"
  pull_request:
    branches-ignore:
      - "chore/l10n*"
    paths:
      - "*"
      - ".github/**"
      - "decidim-admin/**"
      - "decidim-conferences/**"
      - "decidim-core/**"
      - "decidim-dev/**"
      - "decidim-meetings/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        test:
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_unit.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_unit.log' --pattern spec/ --exclude-pattern spec/system
            name: "Unit tests"
            shard: "unit"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_system.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_system.log' --pattern spec/system --exclude-pattern spec/system/admin
            name: "System tests"
            shard: "system"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_system_admin.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_system_admin.log' --pattern spec/system/admin
            name: "Admin system tests"
            shard: "system_admin"
    name: ${{ matrix.test.name }}
    uses: ./.github/workflows/test_app.yml
    secrets: inherit
    with:
      working-directory: "decidim-conferences"
      test_command: ${{ matrix.test.command }}
