name: "[CI] Generators"
on:
  push:
    branches:
      - develop
      - release/*
      - "*-stable"
  pull_request:
    branches-ignore:
      - "chore/l10n*"
    paths:
      - "*"
      - ".github/**"
      - "decidim-core/**"
      - "decidim-generators/**"

env:
  CI: "true"
  RUBY_VERSION: 3.4.7
  NODE_VERSION: 24.18.0
  NODE_ENV: "test"
  DECIDIM_MODULE: decidim-generators
  SHAKAPACKER_RUNTIME_COMPILE: "false"

permissions:
  contents: read
  pull-requests: read


concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        test:
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_branch_flag.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_branch_flag.log' --pattern spec/runtime/branch_flag_spec.rb
            name: BranchFlag
            shard: "branch_flag"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_component_generator.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_component_generator.log' --pattern spec/runtime/component_generator_spec.rb
            name: ComponentGenerator
            shard: "component_generator"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_edge_flag.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_edge_flag.log' --pattern spec/runtime/edge_flag_spec.rb
            name: EdgeFlag
            shard: "edge_flag"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_no_flags.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_no_flags.log' --pattern spec/runtime/no_flags_spec.rb
            name: NoFlags
            shard: "no_flags"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_path_flag.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_path_flag.log' --pattern spec/runtime/path_flag_spec.rb
            name: PathFlag
            shard: "path_flag"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_queue_flag.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_queue_flag.log' --pattern spec/runtime/queue_flag_spec.rb
            name: QueueFlag
            shard: "queue_flag"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_storage_flag.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_storage_flag.log' --pattern spec/runtime/storage_flag_spec.rb
            name: StorageFlag
            shard: "storage_flag"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_full_app_generator.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_full_app_generator.log' --pattern spec/runtime/full_app_generator_spec.rb
            name: FullAppGenerator
            shard: "full_app_generator"
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_lib.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_lib.log' --pattern spec/lib/
            name: Lib
            shard: "lib"
    name: ${{ matrix.test.name }}
    runs-on: ubuntu-24.04
    if: "!startsWith(github.head_ref, 'chore/l10n')"
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:14
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
      DECIDIM_SPAM_DETECTION_BACKEND_RESOURCE: "memory"
      DECIDIM_SPAM_DETECTION_BACKEND_USER: "memory"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Fix APT mirrors
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure.archive.ubuntu.com/d' /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/*.sources || true
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu/|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list || true
      - run: |
          sudo apt-get update && sudo apt-get install libvips libvips-tools
        name: Install libvips
        shell: "bash"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm get cache)-${{ env.DECIDIM_MODULE }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v6
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir-path.outputs.dir }}
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-
      - uses: actions/cache@v6
        id: app-cache
        with:
          path: ./Gemfile.lock
          key: gemfile-${{ hashFiles('Gemfile.lock') }}
          restore-keys: gemfile-${{ hashFiles('Gemfile.lock') }}
      - run: bundle install --jobs 4 --retry 3
        name: Install Ruby deps
        working-directory: ${{ env.DECIDIM_MODULE }}
      - name: Restore parallel test runtimes
        uses: actions/cache@v6
        with:
          path: ${{ env.DECIDIM_MODULE }}/tmp/parallel_runtime_${{ matrix.test.shard }}.log
          key: parallel-runtime-${{ env.DECIDIM_MODULE }}-${{ matrix.test.shard }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            parallel-runtime-${{ env.DECIDIM_MODULE }}-${{ matrix.test.shard }}-${{ github.head_ref || github.ref_name }}-
      - run: ${{ matrix.test.command }}
        name: ${{ matrix.test.name }}
        working-directory: ${{ env.DECIDIM_MODULE }}
        env:
          SIMPLECOV: "true"
      - uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{secrets.QLTY_COVERAGE_TOKEN}}
          verbose: true
          files: coverage/coverage.json
          add-prefix: ${{ env.DECIDIM_MODULE }}
      - uses: codecov/codecov-action@v7
        name: Upload coverage
        with:
          name: decidim-generators
          flags: decidim-generators
