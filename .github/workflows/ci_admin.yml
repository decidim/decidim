name: "[CI] Admin"
on:
  push:
    branches:
      - develop
      - release/*
      - "*-stable"
  pull_request:
    branches-ignore:
      - "chore/l10n*"
    paths:
      - "*"
      - ".github/**"
      - "decidim-admin/**"
      - "decidim-core/**"
      - "decidim-dev/**"
      - "decidim-participatory_processes/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        test:
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_unit.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_unit.log' --pattern spec/ --exclude-pattern 'spec/(system|lib)'
            name: "Tests without system specs"
            parallel_processors: 4
            shard: "unit"
            system_specs: false
            upload_coverage: true
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_lib.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_lib.log' --pattern spec/lib
            name: "Lib specs"
            parallel_processors: 4
            shard: "lib"
            system_specs: false
            upload_coverage: false
          - command: bundle exec parallel_test --type rspec --runtime-log tmp/parallel_runtime_system.log --test-options '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_system.log' --pattern spec/system
            name: "Tests with system specs"
            parallel_processors: 3
            shard: "system"
            system_specs: true
            upload_coverage: false
    name: ${{ matrix.test.name }}
    uses: ./.github/workflows/test_app.yml
    secrets: inherit
    with:
      parallel_processors: ${{ matrix.test.parallel_processors }}
      shard: ${{ matrix.test.shard }}
      system_specs: ${{ matrix.test.system_specs }}
      test_command: ${{ matrix.test.command }}
      upload_coverage: ${{ matrix.test.upload_coverage }}
      working-directory: "decidim-admin"
