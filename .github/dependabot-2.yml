version: 2
updates:
  # Bundler - all Ruby dependencies including decidim-* modules
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day:  "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 2
    # Group decidim internal dependencies together
    groups:
      decidim-modules:
        patterns:
          - "decidim-*"
      rails-dependencies:
        patterns:
          - "rails*"
          - "action*"
          - "active*"
    labels:
      - "dependencies"
      - "ruby"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 2
    groups:
      npm-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"

