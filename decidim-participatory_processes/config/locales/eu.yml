      static_pages:
        democratic_quality_indicators:
          content: |-
            <h2>Decidim-en kalitate-adierazlea neurtzeko adierazle-sistema.</h2>

            <h3>Sarrera</h3>
            <p>Kalitate demokratikoa Decidim-en oinarrizko printzipioetako bat da. Horri eusteko, plataformako partaidetza-prozesuen kalitatea ebaluatzen laguntzen duen adierazle-sistema bat garatu dugu. Artikulu honetan, adierazle horiek nola kalkulatzen diren azaltzen da.</p>

            <h3>Nola kalkulatzen dira adierazleak?</h3>
            <p>Kalitate-adierazleak jasotzeko bi metodo definitu ditugu:</p>

            <ol>
            <li><strong>Neurketa automatikoak:</strong> Decidim plataformako datuetatik zuzenean kalkulatzen dira.</li>
            <li><strong>Autoebaluaziorako galderak:</strong> Administratzaile batek betetako formulario batean oinarritzen dira.</li>
            </ol>

            <p>Adierazle bakoitza ehuneko gisa adierazten da (n/guztira). Ondoren, ehuneko hori 1etik 5era bitarteko eskalako puntuazio bihurtzen da:</p>

            <ul>
            <li>1 = 0–20%</li>
            <li>2 = 20–40%</li>
            <li>3 = 40–60%</li>
            <li>4 = 60–80%</li>
            <li>5 = 80–100%</li>
            </ul>

            <br><br>
            <h3>Neurketa automatikoak</h3>
            <p>Neurketa horiek automatikoki kalkulatzen dira Decidim-en eskuragarri dauden datuetatik abiatuta. Partaidetza-prozesu bakoitzeko ebaluatzen dira, eta administratzaileek publiko egin ditzakete, parte-hartzaile guztiek eskuratu ahal izan ditzaten.</p>

            <p>Lau adierazle nagusi definitu ditugu: Herritarren eragina, Hibridazioa, Erantzuteko gaitasuna eta Trazabilitatea:</p>

            <h3>Herritarren eragina</h3>

            <p>Adierazle honek herritarrek onartutako proposamenetan eta prozesuaren emaitzetan duten eragin-maila neurtzen du.</p>

            <ul>
            <li>
            Herritarren eragina proposamenetan
            <ul>
            <li>Onartutako proposamenen ehunekoa (n/guztira)</li>
            <li>Onartutako <em>herritarren</em> proposamenen ehunekoa, herritarren proposamen guztiekiko (herritarren eragin osoa onartutako proposamenetan)</li>
            <li>Onartutako herritarren proposamenen ehunekoa, onartutako proposamen guztiekiko (herritarren eragin erlatiboa onartutako proposamenetan)</li>
            </ul>
            </li>
            <li>
            Herritarren eragina emaitzetan
            <ul>
            <li>Herritarren proposamenei lotutako emaitzen ehunekoa, emaitza guztiekiko (herritarren eragin osoa emaitzetan)</li>
            </ul>
            </li>
            </ul>

            <h3>Hibridazioa</h3>

            <p>Adierazle honek prozesuan zehar onlineko eta aurrez aurreko espazioak zenbateraino uztartzen diren neurtzen du.</p>

            <ul>
            <li>Topaketen osagaia aktibo dago? (Bai=5, Ez=0)</li>
            <li>Aurrez aurreko topaketak daude? (Bai=5, Ez=0)</li>
            <li>Onlineko topaketak daude? (Bai=5, Ez=0)</li>
            <li>Topaketa hibridoak daude? (Bai=5, Ez=0)</li>
            <li>Topaketetatik sortutako proposamenak daude? (Bai=5, Ez=0)</li>
            </ul>

            <h3>Erantzuteko gaitasuna</h3>

            <p>Adierazle honek erakundeak parte-hartzaileen ekarpenei erantzuteko duen gaitasun-maila neurtzen du. Erakundearen inplikazioa islatzen du, erantzun ofizialen eta gauzatutako erabakien bidez.</p>

            <ul>
            <li>Erantzuna duten proposamenen ehunekoa (n/guztira) – Proposamenekiko erantzun instituzionala</li>
            <li>100%ean osatutako emaitzen ehunekoa (n/guztira)</li>
            </ul>

            <h3>Trazabilitatea</h3>

            <p>Adierazle honek partaidetza-prozesuaren gardentasuna eta trazabilitatea neurtzen ditu. Parte-hartzaileek proposamenen bilakaera zer erraztasunez jarrai dezaketen eta argitaratutako erregistroen bidez erakundearen jarduerak egiazta ditzaketen islatzen du.</p>

            <ul>
            <li>Historia duten proposamenen kopurua (n/guztira)</li>
            <li>Proposamenei lotutako emaitzen ehunekoa (n/guztira)</li>
            <li>Aktak argitaratuta dituzten itxitako topaketen ehunekoa (n/guztira)</li>
            <li>Datu irekien modulua aktibatzea (dikotomikoa: 0 edo 5)</li>
            <li>Aurrekontuekin lotutako proposamenen ehunekoa (n/guztira)</li>
            </ul>

            <br><br>
            <h3>Autoebaluazioko neurketak</h3>

            <p>Neurketa automatikoez gain, <strong>autoebaluazio-formulario</strong> bat erabiltzea proposatzen dugu, partaidetza-prozesu bakoitzaren dimentsio kualitatiboak ebaluatzeko. Plataformako administratzaileek prozesu bakoitzaren amaieran beteko dute formulario hori, eta erantzunak publikoki bistaratuko dira adierazleen eduki-blokean.</p>

            <p>Galdera horien helburua datu kuantitatiboen bidez soilik ebaluatu ezin diren kalitate demokratikoaren alderdiak jasotzea da. Garrantzitsua da kontuan hartzea inkesta honetako erantzunak plataformako administratzaileen iritziak baldintzatzen dituela.</p>

            <br><br>
            <h3>Autoebaluaziorako galderak</h3>

            <p>Jarraian, administratzaileek erantzuten duten autoebaluazio-formularioa osatzen duten galderak eta erantzun bakoitzari lotutako balioak jasotzen dira.</p>

            <h4>Informazio-maila</h4>

            <ol>
            <li>Argitaratutako informazioak argi azaltzen al ditu erabakiak hartzeko mekanismoak (adibidez, bozketa, adostasuna edo zuzeneko negoziazioak)?
            <ul>
            <li>Argitasunik ez = 0</li>
            <li>Argitasun txikia = 1</li>
            <li>Behar besteko argitasuna = 2,5</li>
            <li>Erabateko argitasuna = 5</li>
            </ul>
            </li>
            <li>Informaziorik eman al da parte-hartzaileek eztabaidagai den gaian eragiteko duten gaitasunari buruz (bai prozesuaren komunikazioan eta gonbidapenetan, bai eztabaida-saio bakoitzaren hasieran)?
            <ul>
            <li>Inoiz ez = 0</li>
            <li>Ia inoiz ez = 1</li>
            <li>Normalean = 2,5</li>
            <li>Beti = 5</li>
            </ul>
            </li>
            </ol>

            <h4>Herritarren eragina</h4>

            <ol>
            <li>Prozesuko partaidetza-mailaren balorazioa
            <ul>
            <li>Parte-hartzaileek erakundearen informazioa jaso zuten. = 1</li>
            <li>Parte-hartzaileei kontsulta egin zitzaien edo erakundeari iritzia eman zioten. = 2</li>
            <li>Parte-hartzaileek erabakiak hartzeko ahalmena partekatu zuten. = 3</li>
            <li>Parte-hartzaileek modu erabakigarrian parte hartu zuten erabakiak hartzean. = 4</li>
            <li>Parte-hartzaileek erabakiak hartzean eta baliabideen kudeaketan edo gauzapenean parte hartu zuten. = 5</li>
            </ul>
            </li>
            <li>Herritarrek erabakietan 0-5 mailako esku-hartzea duten faseen ehunekoa.
            <p>Prozesuaren fase guztietatik (gaiak hautatzetik gauzapena gainbegiratzera arte), zenbatetan dute herritarrek erabakiak hartzeko edo ekintza exekutiboak gauzatzeko ahalmena?</p>
            <ul>
            <li>0-20% = 1</li>
            <li>20-40% = 2</li>
            <li>40-60% = 3</li>
            <li>60-80% = 4</li>
            <li>80-100% = 5</li>
            </ul>
            </li>
            </ol>

            <h4>Inklusibitatea</h4>

            <ol>
            <li>Nola baloratzen da eragileen eta parte-hartzaileen aniztasun-maila, prozesuko erreferentziazko biztanleriarekin alderatuta?
            <ul>
            <li>Batere ez = 0</li>
            <li>Txikia = 1</li>
            <li>Nahikoa = 2,5</li>
            <li>Ona = 5</li>
            </ul>
            </li>
            <li>Zenbat hizkuntzatan komunikatu da prozesua?
            <ul>
            <li>Hizkuntza batean = 1</li>
            <li>Komunitatean hitz egiten diren hizkuntzen erdia baino gutxiagotan = 2,5</li>
            <li>Komunitatean hitz egiten diren hizkuntzen erdia baino gehiagotan = 5</li>
            </ul>
            </li>
            <li>Aurrez aurreko topaketen lekuak irisgarriak izan al ziren mugikortasun urriko pertsonentzat?
            <ul>
            <li>Ez = 0</li>
            <li>Partzialki = 2,5</li>
            <li>Bai = 5</li>
            </ul>
            </li>
            <li>Partaidetza-saioak ordutegi desberdinetan programatu dira (goizez, eguerdian, arratsaldez, iluntzean eta asteburuetan).
            <ul>
            <li>Ez = 0</li>
            <li>Partzialki = 2,5</li>
            <li>Bai = 5</li>
            </ul>
            </li>
            <li>Laguntza digitala eskaini al zaie parte-hartzaileei?
            <ul>
            <li>Ez = 0</li>
            <li>Partzialki = 2,5</li>
            <li>Bai = 5</li>
            </ul>
            </li>
            </ol>
          title: Kalitate demokratikoaren adierazleak
