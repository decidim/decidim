                legend: De todas as fases do proceso (desde a selección de temas ata a supervisión da execución), en cantas ten a cidadanía capacidade para tomar decisións ou realizar accións executivas?
              citizen_influence_level:
                legend: En que medida ten a cidadanía capacidade de decisión neste proceso, desde recibir simplemente información ata influír de maneira decisiva nas decisións e xestionar recursos?
                options:
                  five: As persoas participantes implicáronse na toma de decisións e na xestión de recursos ou na execución
                  four: As persoas participantes implicáronse de maneira decisiva na toma de decisións
                  one: As persoas participantes recibiron información da organización
                  three: As persoas participantes implicáronse compartindo o poder de decisión
                  two: Consultouse ás persoas participantes ou estas proporcionaron comentarios á organización
              name: Influencia cidadá
            inclusiveness:
              description: Inclusividade segundo a orixe cultural e a diversidade funcional.
              digital_support_offered:
                legend: Ofreceuse apoio dixital ás persoas participantes?
                options:
