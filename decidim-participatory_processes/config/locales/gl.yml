      static_pages:
        democratic_quality_indicators:
          content: |-
            <h2>Sistema de indicadores para medir a calidade democrática en Decidim.</h2>

            <h3>Introdución</h3>
            <p>A calidade democrática é un principio fundamental de Decidim. Para garantila, desenvolvemos un sistema de indicadores que axudan a avaliar a calidade dos procesos participativos na plataforma. Este artigo explica como se calculan estes indicadores.</p>

            <h3>Como se calculan os indicadores?</h3>
            <p>Definimos dous métodos para recoller os indicadores de calidade:</p>

            <ol>
            <li><strong>Métricas automáticas:</strong> calcúlanse directamente a partir dos datos da plataforma Decidim.</li>
            <li><strong>Preguntas de autoavaliación:</strong> baséanse nun formulario cuberto por unha persoa administradora.</li>
            </ol>

            <p>Cada indicador exprésase como unha porcentaxe (n/total). Esta porcentaxe convértese despois nunha puntuación nunha escala do 1 ao 5:</p>

            <ul>
            <li>1 = 0–20%</li><li>2 = 20–40%</li><li>3 = 40–60%</li><li>4 = 60–80%</li><li>5 = 80–100%</li>
            </ul>

            <br><br>
            <h3>Métricas automáticas</h3>
            <p>Estas métricas calcúlanse automaticamente a partir dos datos dispoñibles en Decidim. Avalíanse para cada proceso participativo e o equipo de administración pode facelas públicas para que todas as persoas participantes poidan consultalas.</p>
            <p>Definimos catro indicadores principais: influencia cidadá, hibridación, capacidade de resposta e trazabilidade.</p>

            <h3>Influencia cidadá</h3>
            <p>Este indicador mide o nivel de influencia cidadá nas propostas aceptadas e nos resultados do proceso.</p>

            <h3>Hibridación</h3>
            <p>Este indicador mide o nivel de combinación entre espazos en liña e presenciais durante o proceso.</p>

            <h3>Capacidade de resposta</h3>
            <p>Este indicador mide o nivel de resposta da organización ás achegas das persoas participantes. Reflicte o seu compromiso mediante respostas oficiais e decisións aplicadas.</p>

            <h3>Trazabilidade</h3>
            <p>Este indicador mide a transparencia e a trazabilidade do proceso participativo. Reflicte con que facilidade as persoas participantes poden seguir a evolución das propostas e verificar as actuacións institucionais mediante rexistros publicados.</p>

            <br><br>
            <h3>Métricas de autoavaliación</h3>
            <p>Ademais das métricas automáticas, propoñemos utilizar un <strong>formulario de autoavaliación</strong> para avaliar as dimensións cualitativas de cada proceso participativo. O equipo de administración da plataforma cubrirá este formulario ao final de cada proceso e as respostas mostraranse publicamente no bloque de contido dos indicadores.</p>
            <p>Estas preguntas pretenden recoller aspectos da calidade democrática que non se poden avaliar só mediante datos cuantitativos. É importante ter en conta que as respostas a esta enquisa están condicionadas pola opinión do equipo de administración da plataforma.</p>
          title: Indicadores de calidade democrática
