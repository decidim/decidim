      api_users:
        index:
          explanation_html: |
            <p>As contas de API permiten ás persoas desenvolvedoras de integracións engadir ao sistema contas técnicas con permisos administrativos. Estas contas técnicas poden actuar como administradoras da plataforma para realizar actualizacións que normalmente se farían desde o panel de administración. Un caso habitual é unha plataforma externa de xestión na que un script automatizado realiza tarefas administrativas sen que unha persoa real teña que autenticarse no sistema. Por exemplo, un sistema de automatización pode querer enviar respostas a propostas, caso no que se precisa unha conta de integración para realizar esta tarefa na plataforma.</p>
            <p>A principal diferenza entre estas contas e as contas normais de administración é que están pensadas para seren usadas por máquinas e, por tanto, os requisitos do seu contrasinal son distintos. Estas contas non precisan actualizar regularmente o contrasinal e este pode cambiarse de maneira xestionada cando sexa necesario.</p>
            <p>Estas credenciais están destinadas ao uso por máquinas. As aplicacións orientadas ás persoas participantes deben integrarse mediante <a href="%{oauth_link}">aplicacións OAuth</a>.</p>
          manage: Xestionar contas de API
        new:
          select_organization: Selecciona a túa organización
          title: Crear unha nova conta de API
