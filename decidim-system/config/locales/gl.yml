            admin_hint: Estes tipos MIME están permitidos na sección de subidas do panel de administración. Os participantes administradores teñen que ser conscientes dos riscos de subir algúns formatos de documentos, agardase entón que sexan cautelosos á hora de subir ficheiros.
            default_hint: Estas tipos MIME están permitidos de xeito predefinido para todos os participantes.
            intro_html: Podes engadir comodíns co asterisco para os tipos MIME, p. ex. <code>image/*</code>.
            title: Tipos MiME permitidos
