        create:
          error: Produciuse un problema ao crear esta aplicación.
          success: Aplicación creada con éxito.
        destroy:
          error: Produciuse un problema ao destruír esta aplicación.
          success: Aplicación destruída con éxito.
        edit:
          save: Gardar
          title: Editar aplicación
        form:
          application_type:
            confidential:
              explanation: Aplicacións que poden autenticarse de forma segura no servidor de autorización, por exemplo mantendo protexido o segredo de cliente rexistrado. Normalmente trátase dunha aplicación executada nun servidor onde se almacena o segredo de cliente.
              name: Confidencial
            public:
              explanation: Aplicacións que non poden usar segredos de cliente rexistrados, como as que se executan nun navegador ou nun dispositivo móbil.
              name: Público
          application_type_help_html: 'O tipo de cliente OAuth segundo se define en <a href="%{client_type_link}" target="_blank">RFC 6749, sección 2.1</a>. Os clientes públicos deben implementar o fluxo PKCE segundo se define en <a href="%{pkce_link}" target="_blank">RFC 7636</a>. '
          refresh_tokens_help_html: 'Os tokens de actualización son útiles cando o token precisa unha duración maior ca a asignada ao token de acceso. Ten en conta que <strong>os tokens de actualización deben usarse con coidado</strong>, xa que poden reducir a seguridade das persoas participantes. '
          scopes_explanation:
            "admin:read": Permite realizar operacións de consulta relacionadas coa administración mediante a API GraphQL.
            "admin:write": Permite realizar operacións de mutación de administración mediante a API GraphQL.
            "api:read": Permite realizar operacións de consulta mediante a API GraphQL.
            "api:write": Permite realizar operacións de mutación mediante a API GraphQL.
            profile: Permite acceder aos datos do perfil propio da persoa participante. Este é o único ámbito necesario se a aplicación OAuth se utiliza unicamente como provedor de identidade ou servizo de autenticación.
            user: Permite actuar como a persoa participante que iniciou sesión usando o token indicado nas chamadas á API GraphQL. É necesario para todas as operacións api:write e para as operacións api:read que precisen información da persoa participante actual.
          scopes_help_html: |
            Os ámbitos seleccionados estarán dispoñibles para que as aplicacións conectadas os soliciten durante o proceso de autorización. Á persoa participante mostráranselle os detalles da solicitude de autorización cando inicie sesión mediante OAuth.
            <br>
            Os distintos ámbitos ofrecen funcionalidades diferentes á persoa autenticada mediante os tokens de acceso concedidos.
            <br>
            <strong>Nota:</strong> se só precisas autenticar participantes nas túas aplicacións externas, abonda co ámbito <strong>profile</strong>. As aplicacións que interactúan coa API de Decidim tamén precisan outros ámbitos.
          select_organization: Seleccionar unha organización
