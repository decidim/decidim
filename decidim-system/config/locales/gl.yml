        create:
          error: Produciuse un erro ao crear unha nova organización.
          error_invitation: Produciuse un problema ao crear unha nova organización. Revisa o nome da persoa administradora da organización.
          success_html: |
            <p>
              A organización creouse correctamente.
            </p>
            <ol>
              <li>Pode que teñas que actualizar o código da aplicación. Para permitir solicitudes a %{host}, debes engadir o seguinte á configuración do contorno (por exemplo, <code>config/environment/production.rb</code>) ou ao teu <code>config/application.rb</code>:
                <p> config.hosts << "%{host}" </p>
              </li>
              <li>
                Despois poderás acceder á plataforma mediante <a href="http://%{host}">http://%{host}</a>
              </li>
              <li>
                Enviamos un correo electrónico a <b>%{email}</b> que debes confirmar.
              </li>
            </ol>
        csp_settings:
          connect_src_hint: |
            The connect-src directive restricts the URLs which can be loaded using <script> elements.
            A plataforma engadirá 'self', pero permite engadir máis valores. Déixao en branco se non tes certeza.
          default_src_hint: |
            A directiva default-src é a política predeterminada para cargar contidos como JavaScript, imaxes, CSS, fontes, solicitudes AJAX, marcos e contido multimedia HTML5.
            A plataforma engadirá "'self' 'unsafe-inline'", pero permite engadir máis valores. Déixao en branco se non tes certeza.
          font_src_hint: |
            The font-src directive restricts the URLs which can be loaded using @font-face.
            A plataforma engadirá 'self', pero permite engadir máis valores. Déixao en branco se non tes certeza.
          frame_src_hint: |
            The frame-src directive restricts the URLs which can be loaded using <frame>, <iframe> and <object> elements.
            A plataforma engadirá 'self', pero permite engadir máis valores. Déixao en branco se non tes certeza.
          img_src_hint: |
            The img-src directive restricts the URLs which can be loaded using <img>, <image>, <picture> and <svg> elements.
            A plataforma engadirá 'self', pero permite engadir máis valores. Déixao en branco se non tes certeza.
          media_src_hint: |
            The media-src directive restricts the URLs which can be loaded using the <video>, <audio> and <source> elements.
            A plataforma engadirá 'self', pero permite engadir máis valores. Déixao en branco se non tes certeza.
          script_src_hint: |
            The script-src directive restricts the URLs which can be loaded using <script> elements.
            A plataforma engadirá "'self' 'unsafe-inline' 'unsafe-eval'", pero permite engadir máis valores. Déixao en branco se non tes certeza.
          style_src_hint: |
            The style-src directive restricts the URLs which can be loaded using <style> elements.
            A plataforma engadirá "'self' 'unsafe-inline'", pero permite engadir máis valores. Déixao en branco se non tes certeza.
        edit:
          confirm_resend_invitation: Seguro que queres reenviar a invitación?
          resend_invitation: Reenvio a invitación
