            admin_hint: Estas extensións de ficheiro están permitidas na sección de subidas do panel de administración. Os participantes administradores teñen que ser conscientes dos riscos de subir algúns formatos de documentos, agardase entón que sexan cautelosos á hora de subir ficheiros.
            default_hint: Estas extensións de ficheiro están permitidas de xeito predefinido para todos os participantes.
            image_hint: Estas extensións de ficheiro están permitidas para calquera imaxe a subir.
            title: Extensións de ficheiro permitidas
          file_sizes:
            avatar_hint: Megabytes (MB). Este límite no tamaño de ficheiro é o empregado para subir a imaxe do avatar.
            default_hint: Megabytes (MB). Este límite no tamaño de ficheiro é o predefinido a empregar para todos os ficheiros a subir agás se especifique o contrario.
            title: Tamaño máximo de ficheiros
          intro: |
            Por favor, ten moita precaución á hora de mudar estes axustes. Cantas menos opcións permitas, mellor.
            Permitir extensións especificas ou tipos MIME, pode expor os participantes do sistema a riscos de seguranza e tamén pode afectar á accesibilidade do sitio web.
        header_snippets_help_html: Usa este campo para engadir elementos á cabeceira HTML. O uso máis habitual é integrar servizos de terceiros que requiren JavaScript ou CSS adicional. Tamén podes usalo para engadir metaetiquetas ao HTML. Ten en conta que só se renderizará nas páxinas públicas, non na sección de administración. Se o código interactúa con API externas ou non cumpre as directrices de seguridade da aplicación, será necesario modificar a Política de seguridade de contidos. Máis información <a href="https://docs.decidim.org/en/develop/customize/content_security_policy">no sitio da documentación</a>.
