      api_users:
        index:
          explanation_html: |
            <p>Mit API-Konten können Integrationsentwickler:innen administrative Maschinenkonten zum System hinzufügen. Diese Maschinenkonten können auf der Plattform als Admin agieren, um Aktualisierungen vorzunehmen, die normale Admins sonst über den Administrationsbereich durchführen würden. Ein typischer Anwendungsfall ist eine externe Verwaltungsplattform, bei der ein automatisiertes Skript administrative Aufgaben auf der Plattform ausführt, ohne dass sich eine reale Person am System authentifizieren muss. Ein Automatisierungssystem möchte beispielsweise Antworten auf Vorschläge senden; in diesem Fall benötigen wir ein Integrationskonto, das diese Aufgabe innerhalb der Plattform übernimmt.</p>
                  <p>Der Hauptunterschied zwischen diesen Konten und normalen Admin-Konten besteht darin, dass diese Konten für die Nutzung durch Maschinen bestimmt sind und daher andere Anforderungen an das Passwort gelten. Diese Konten müssen ihr Passwort nicht regelmässig aktualisieren, und das Kontopasswort kann bei Bedarf kontrolliert geändert werden.</p>
                  <p>Diese Zugangsdaten sind für die Nutzung durch Maschinen bestimmt. Anwendungen mit direktem Kontakt zu Teilnehmenden sollten stattdessen über <a href="%{oauth_link}">OAuth-Anwendungen</a> eingebunden werden.</p>
          manage: API-Konten verwalten
        new:
          select_organization: Wählen Sie Ihre Organisation aus
          title: Neues API-Konto erstellen
