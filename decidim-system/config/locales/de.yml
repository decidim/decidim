      oauth_applications:
        create:
          error: Beim Erstellen dieser Anwendung ist ein Fehler aufgetreten.
          success: Anwendung erfolgreich erstellt.
        destroy:
          error: Beim Löschen dieser Anwendung ist ein Fehler aufgetreten.
          success: Anwendung erfolgreich gelöscht.
        edit:
          save: Speichern
          title: Anwendung bearbeiten
        form:
          application_type:
            confidential:
              explanation: Anwendungen, die sich sicher gegenüber dem Autorisierungsserver authentifizieren können, zum Beispiel indem sie ihr registriertes Client-Secret sicher aufbewahren können. Typischerweise eine Anwendung, die auf einem Server läuft, auf dem das Client-Secret gespeichert ist.
              name: Vertraulich
            public:
              explanation: Anwendungen, die kein registriertes Client-Secret verwenden können, etwa Anwendungen, die in einem Browser oder auf einem Mobilgerät laufen.
              name: Öffentlich
          application_type_help_html: 'Der OAuth-Client-Typ gemäss <a href="%{client_type_link}" target="_blank">RFC 6749, Abschnitt 2.1</a>. Öffentliche Clients müssen den PKCE-Ablauf gemäss <a href="%{pkce_link}" target="_blank">RFC 7636</a> implementieren. '
          refresh_tokens_help_html: 'Refresh-Tokens sind nützlich, wenn ein Token eine längere Lebensdauer benötigt, als für das Access-Token vorgesehen ist. Beachten Sie, dass <strong>Refresh-Tokens mit Vorsicht verwendet werden sollten</strong>, da sie die Sicherheit Ihrer Nutzenden beeinträchtigen können. '
          scopes_explanation:
            "admin:read": Ermöglicht es, über die GraphQL-API administrative Abfragen (Query-Operationen) durchzuführen.
            "admin:write": Ermöglicht es, über die GraphQL-API administrative Änderungsoperationen (Mutation-Operationen) durchzuführen.
            "api:read": Ermöglicht es, über die GraphQL-API Abfragen (Query-Operationen) durchzuführen.
            "api:write": Ermöglicht es, über die GraphQL-API Änderungsoperationen (Mutation-Operationen) durchzuführen.
            profile: Gewährt Zugriff auf die eigenen Profildetails. Dieser Scope genügt, wenn die OAuth-Anwendung nur als Identitätsanbieter oder Authentifizierungsdienst genutzt wird.
            user: Ermöglicht es, bei Aufrufen der GraphQL-API mit dem angegebenen Token als die angemeldete Person zu agieren. Dies ist für alle api:write-Operationen sowie für api:read-Operationen erforderlich, die Informationen über die aktuell angemeldete Person benötigen.
          scopes_help_html: |
            Die ausgewählten Scopes stehen den verbundenen Anwendungen zur Verfügung, um sie während des Autorisierungsprozesses anzufordern. Beim Anmelden über OAuth werden der jeweiligen Person Details zur Autorisierungsanfrage angezeigt.
                  <br>
                  Unterschiedliche Scopes bieten unterschiedliche Funktionen für die angemeldete Person über die gewährten Access-Tokens.
                  <br>
                  <strong>Hinweis:</strong> Wenn Sie Ihre Nutzenden nur gegenüber Ihren externen Anwendungen authentifizieren müssen, benötigen Sie lediglich den Scope <strong>profile</strong>. Anwendungen, die mit der Decidim-API interagieren, benötigen zusätzliche Scopes.
          select_organization: Organisation wählen
