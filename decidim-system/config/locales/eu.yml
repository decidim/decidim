        csp_settings:
          connect_src: Connect src
          connect_src_hint: |
            Connect-src zuzentarauak <script> elementuen bidez karga daitezkeen URLak mugatzen ditu.
            Plataformak 'self' gehituko du, baina gehiago gehitzeko aukera ematen dizu. Zalantzarik baduzu, utzi hutsik.
          default_src: Src lehenetsia
          default_src_hint: |
            Default-src jarraibidea JavaScript, irudiak, CSS, letra-tipoak, AJAX eskaerak, frameak eta HTML5 multimedia-edukiak kargatzeko politika lehenetsia da. Plataformak "'self' 'unsafe-inline'" gehituko du, baina gehiago gehitzeko aukera ematen dizu. Ziur ez bazaude, utzi hutsik.
          font_src: Letra-tipoaren src-a
          font_src_hint: |
            Font-src jarraibideak @font-face erabiliz karga daitezkeen URLak mugatzen ditu. Plataformak 'self' gehituko du, baina gehiago gehitzeko aukera ematen dizu. Ziur ez bazaude, utzi hutsik.
          frame_src: Frame src
          frame_src_hint: |
            Frame-src direktibak <frame>, <iframe> eta <object> elementuak erabiliz karga daitezkeen URLak mugatzen ditu.
            Plataformak 'self' gehituko du, baina gehiago gehitzeko aukera ematen dizu. Ziur ez bazaude, utzi hutsik.
          img_src: Img src
          img_src_hint: |
            Img-src direktibak <img>, <image>, <picture> eta <svg> elementuak erabiliz karga daitezkeen URLak mugatzen ditu.
            Plataformak 'self' gehituko du, baina gehiago gehitzeko aukera ematen dizu. Ziur ez bazaude, utzi hutsik.
          media_src: Multimedia src
          media_src_hint: |
            Media-src direktibak <video>, <audio> eta <source> elementuak erabiliz karga daitezkeen URLak mugatzen ditu.
            Plataformak 'self' gehituko du, baina gehiago gehitzeko aukera ematen dizu. Ziur ez bazaude, utzi hutsik.
          script_src: Script-src
          script_src_hint: |
            Script-src direktibak <script> elementuak erabiliz karga daitezkeen URLak mugatzen ditu.
            Plataformak "'self' 'unsafe-inline' 'unsafe-eval'" gehituko du, baina gehiago gehitzeko aukera ematen dizu. Ziur ez bazaude, utzi hutsik.
          style_src: Style src
          style_src_hint: |
