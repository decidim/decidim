      api_users:
        index:
          explanation_html: |
            <p>API erabiltzaileek integrazio-garatzaileei administraziorako makina-erabiltzaileen kontuak sistemara gehitzeko aukera ematen diete. Makina-erabiltzaile horiek plataforman administratzaile gisa jardun dezakete administratzaile arruntek administrazio-panelaren bidez egingo lituzketen eguneraketak egiteko. Ohiko erabilera-kasu bat kanpoko kudeaketa-plataforma bat da eta bertan script automatizatu batek plataformarekin administrazio-lanak egiten ditu benetako parte-hartzaile batek sisteman autentifikatu beharrik izan gabe. Adibidez, automatizazio-sistema batek proposamenei erantzunak bidali nahi badizkie integrazio-erabiltzaile bat behar dugu zeregin hori plataforma honetan egiteko.</p>
            <p>Kontu hauen eta administratzaile arrunten arteko desberdintasun nagusia da erabiltzaile hauek makinek erabiltzeko direla eta horregatik pasahitzaren eskakizunak desberdinak direla. Erabiltzaile hauek ez dute pasahitza aldian-aldian eguneratu beharrik eta kontuaren pasahitza modu kudeatuan alda daiteke behar denean.</p>
            <p>Kredentzial hauek makinek erabiltzeko dira. Parte-hartzaileei zuzendutako aplikazioak <a href="%{oauth_link}">OAuth aplikazioekin</a> integratu behar dira.</p>
