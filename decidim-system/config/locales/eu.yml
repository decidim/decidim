            public:
              explanation: Erregistratutako bezeroen sekretuak erabili ezin dituzten aplikazioak, hala nola nabigatzaile batean edo gailu mugikor batean exekutatzen diren aplikazioak.
              name: Publikoa
          application_type_help_html: 'OAuth bezero mota <a href="%{client_type_link}" target="_blank">RFC 6749ren 2.1 atalak</a> definitzen duen bezala. Bezero publikoek PKCE fluxua ezarri behar dute <a href="%{pkce_link}" target="_blank">RFC 7636</a> arauak definitzen duen bezala. '
          refresh_tokens_help_html: 'Freskatzeko fitxak erabilgarriak dira baldin eta fitxak sarbide-fitxari esleitutakoa baino bizialdi luzeagoa behar badu. Kontuan izan <strong>freskatzeko fitxak kontuz erabili behar</strong> direla zure erabiltzaileen segurtasuna ahuldu dezaketelako '
          scopes_explanation:
            "api:read": Parte-hartzaileari kontsultak egiteko aukera ematen dio API grafikoaren bidez.
            "api:write": Parte-hartzaileari GraphQL APIaren bidez mutazio-eragiketak egiteko aukera ematen dio.
            profile: Parte-hartzailearen profilaren xehetasunak eskuratzeko aukera ematen du. Irismen hau soilik behar da OAuth aplikazioa identitate-hornitzaile edo autentifikazio-zerbitzu gisa bakarrik erabiltzen bada.
            user: Emandako tokenarekin saioa hasita duen parte-hartzaile gisa jarduteko aukera ematen du GraphQL APIrako deietan. Hau beharrezkoa da api:write eragiketa guztietarako edo uneko parte-hartzaileari buruzko informazioa behar duten api:read eragiketetarako.
          scopes_help_html: |
            Hautatutako eremuak konektatutako aplikazioek baimen-prozesuan eskatzeko erabilgarri egongo dira. Parte-hartzaileari baimen-eskaerari buruzko xehetasunak erakutsiko zaizkio OAuth erabiliz saioa hasten duenean.
            <br>
            Eremu desberdinek funtzio desberdinak eskaintzen dizkiote autentifikatutako parte-hartzaileari, emandako sarbide-tokenak erabiliz.
            <br>
            <strong>Oharra:</strong> Zure kanpoko aplikazioetan parte-hartzaileak autentifikatu besterik ez baduzu behar, <strong>profile</strong> eremua baino ez duzu behar. Decidim APIarekin elkarreragiten duten aplikazioek beste eremu batzuk ere behar dituzte.
