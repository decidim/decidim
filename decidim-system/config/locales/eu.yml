              explanation: Baimen-zerbitzariarekin modu seguruan autentifikatzeko gai diren aplikazioak, adibidez, erregistratutako bezero-sekretua seguru gordetzeko gai direnak. Normalean, bezero-sekretua gordeta dagoen zerbitzari batean exekutatzen den aplikazio bat izaten da.
